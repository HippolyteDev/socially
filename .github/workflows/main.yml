name: CI Socially

on:
  push:
    branches: [master, develop]
  pull_request:
    branches: [master, develop]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      DIRECT_URL: ${{ secrets.DIRECT_URL }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Installation de Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installation des dépendances
        run: npm ci

      - name: Génération du client Prisma
        run: npx prisma generate

      - name: Vérification du Lint Next.js (ESLint)
        run: npm run lint

      - name: Génération des types Next.js
        run: npx next typegen

      - name: Vérification des types Next.js (TypeScript)
        run: npm run typecheck

      - name: Installation des dépendances API
        working-directory: api
        run: npm ci

      - name: Vérification des types API (TypeScript)
        working-directory: api
        run: npm run typecheck

      - name: Build API
        working-directory: api
        run: npm run build

      - name: Installation des dépendances Backoffice
        working-directory: backoffice
        run: npm ci

      - name: Vérification du Lint Backoffice (ESLint)
        working-directory: backoffice
        run: npm run lint

      - name: Build Backoffice
        working-directory: backoffice
        run: npm run build

      - name: Tentative de Build Next.js
        run: npm run build

      - name: Run unit tests
        run: npm test
